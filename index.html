<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SETCLICK | Вход + Восстановление пароля</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            max-width: 450px;
            width: 100%;
            background: rgba(18, 25, 45, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 32px;
            border: 1px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 20px 35px -10px black;
        }
        h1 {
            color: #ffdf8c;
            text-align: center;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            background: #0f1422;
            border: 1px solid #ffcc66;
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        input::placeholder {
            color: #888;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #e67e22;
            border: none;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.1s;
        }
        button:active { transform: scale(0.97); }
        .btn-secondary {
            background: #2c3e66;
        }
        .btn-reset {
            background: transparent;
            border: 1px solid #ffaa55;
            color: #ffaa55;
            margin-top: 12px;
        }
        .switch-link {
            text-align: center;
            margin-top: 16px;
            color: #ffcc66;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .error {
            color: #ff8888;
            font-size: 0.8rem;
            margin-top: 8px;
            text-align: center;
        }
        .success {
            color: #88ff88;
            font-size: 0.8rem;
            margin-top: 8px;
            text-align: center;
        }
        .game-panel {
            display: none;
        }
        .balance {
            font-size: 2rem;
            text-align: center;
            margin: 20px 0;
            color: #ffecb3;
        }
        .click-btn {
            background: radial-gradient(circle at 30% 20%, #f9b43a, #e67e22);
            font-size: 2rem;
            padding: 20px;
            box-shadow: 0 8px 0 #b45f1b;
        }
        .logout-btn {
            background: #b53b2e;
            margin-top: 16px;
        }
        .user-info {
            text-align: center;
            margin-bottom: 16px;
            color: #ccc;
        }
        .role-badge {
            display: inline-block;
            background: #000000aa;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.8rem;
            margin-top: 8px;
        }
        .flex-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<!-- Панель входа/регистрации -->
<div id="authPanel" class="card">
    <h1>🔥 SETCLICK 🔥</h1>
    <div class="input-group">
        <input type="email" id="emailInput" placeholder="Почта (логин)">
    </div>
    <div class="input-group">
        <input type="password" id="passwordInput" placeholder="Пароль (придумай свой)">
    </div>
    <button id="loginBtn">🔐 Войти</button>
    <button id="registerBtn" class="btn-secondary">📝 Зарегистрироваться</button>
    <button id="resetPasswordBtn" class="btn-reset">❓ Забыл пароль</button>
    <div id="authMessage"></div>
</div>

<!-- Игровая панель (после входа) -->
<div id="gamePanel" class="card game-panel">
    <h1>🔥 SETCLICK 🔥</h1>
    <div class="user-info" id="userInfo"></div>
    <div class="balance">💰 <span id="moneyDisplay">0</span> 🪙</div>
    <button id="clickBtn" class="click-btn">💥 КЛИК 💥</button>
    <div>➕ Сила клика: <strong id="clickPower">1</strong></div>
    <div class="flex-row">
        <button id="upgradePotionBtn">🧪 Улучшить зелье (ур. <span id="potionLvl">0</span>)</button>
        <button id="buyPotionBtn">💊 Купить зелье</button>
    </div>
    <div id="potionStatus" class="role-badge">⚗️ Зелье: не активно</div>
    <button id="logoutBtnGame" class="logout-btn">🚪 Выйти</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getDatabase, ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB-0kywlbxj-PRLL7KPPlhpRRx_caYKL9Q",
        authDomain: "setclick-7ac2d.firebaseapp.com",
        databaseURL: "https://setclick-7ac2d-default-rtdb.firebaseio.com",
        projectId: "setclick-7ac2d",
        storageBucket: "setclick-7ac2d.firebasestorage.app",
        messagingSenderId: "363653321881",
        appId: "1:363653321881:web:b0baadd261195fa4571408",
        measurementId: "G-SM3WVQMD3Q"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // === НАСТРОЙКА: укажи почту владельца (кто получит роль owner) ===
    const OWNER_EMAIL = "akkountnik@gmail.com";  // 🔥 ЗАМЕНИ НА СВОЮ ПОЧТУ!

    let currentUserData = null;
    let potionTimer = null;

    async function createOrUpdateUserInDB(user) {
        const userRef = ref(db, `users/${user.uid}`);
        const snapshot = await get(userRef);
        
        let role = "user";
        if (user.email === OWNER_EMAIL) role = "owner";
        
        if (!snapshot.exists()) {
            await set(userRef, {
                email: user.email,
                name: user.email.split('@')[0],
                role: role,
                mainMoney: 500,
                vipMoney: 0,
                isBanned: false,
                potionLevel: 0,
                potionActive: false,
                potionEndTime: 0,
                createdAt: Date.now()
            });
        } else {
            const existing = snapshot.val();
            if (user.email === OWNER_EMAIL && existing.role !== "owner") {
                await update(userRef, { role: "owner" });
                role = "owner";
            }
        }
        return role;
    }

    function getClickPower(userData) {
        let bonus = 0;
        if (userData.potionActive && userData.potionEndTime > Date.now()) {
            bonus = 3 + (userData.potionLevel || 0) * 2;
        }
        return 1 + bonus;
    }

    function refreshGameUI(userData) {
        document.getElementById('moneyDisplay').innerText = Math.floor(userData.mainMoney);
        document.getElementById('clickPower').innerText = getClickPower(userData);
        document.getElementById('potionLvl').innerText = userData.potionLevel || 0;
        
        const isActive = userData.potionActive && userData.potionEndTime > Date.now();
        if (isActive) {
            let remaining = Math.max(0, Math.ceil((userData.potionEndTime - Date.now()) / 1000));
            document.getElementById('potionStatus').innerHTML = `⚗️ Зелье АКТИВНО (${remaining} сек) +${3 + (userData.potionLevel||0)*2} силы`;
        } else {
            document.getElementById('potionStatus').innerHTML = `⚗️ Зелье не активно`;
        }
        
        document.getElementById('userInfo').innerHTML = `
            👤 ${userData.name || userData.email.split('@')[0]}<br>
            🎭 Роль: ${userData.role} ${userData.isBanned ? '❌ ЗАБАНЕН' : ''}
        `;
        
        const clickBtn = document.getElementById('clickBtn');
        if (clickBtn) clickBtn.disabled = userData.isBanned;
    }

    async function updateUserInDB(uid, data) {
        await update(ref(db, `users/${uid}`), data);
    }

    async function handleClick(uid, userData) {
        if (userData.isBanned) {
            alert("Вы забанены!");
            return;
        }
        const gain = getClickPower(userData);
        const newMoney = userData.mainMoney + gain;
        await updateUserInDB(uid, { mainMoney: newMoney });
    }

    async function buyPotion(uid, userData) {
        const cost = 80 + (userData.potionLevel || 0) * 25;
        if (userData.mainMoney >= cost && !userData.isBanned) {
            await updateUserInDB(uid, { mainMoney: userData.mainMoney - cost });
            const endTime = Date.now() + 25000;
            await updateUserInDB(uid, { potionActive: true, potionEndTime: endTime });
            startPotionTimer(uid);
        } else {
            alert(`Не хватает ${cost} монет`);
        }
    }

    async function upgradePotion(uid, userData) {
        const cost = 120 + (userData.potionLevel || 0) * 35;
        if (userData.mainMoney >= cost && !userData.isBanned) {
            await updateUserInDB(uid, { 
                mainMoney: userData.mainMoney - cost, 
                potionLevel: (userData.potionLevel || 0) + 1 
            });
        } else {
            alert(`Не хватает ${cost} монет`);
        }
    }

    function startPotionTimer(uid) {
        if (potionTimer) clearInterval(potionTimer);
        potionTimer = setInterval(async () => {
            const userRef = ref(db, `users/${uid}`);
            const snapshot = await get(userRef);
            const userData = snapshot.val();
            if (userData && userData.potionActive && userData.potionEndTime < Date.now()) {
                await updateUserInDB(uid, { potionActive: false, potionEndTime: 0 });
                clearInterval(potionTimer);
                potionTimer = null;
            }
            const fresh = await get(userRef);
            if (fresh.exists()) refreshGameUI(fresh.val());
        }, 500);
    }

    function setupGameListeners(uid) {
        const userRef = ref(db, `users/${uid}`);
        onValue(userRef, (snapshot) => {
            if (snapshot.exists()) {
                currentUserData = snapshot.val();
                refreshGameUI(currentUserData);
            }
        });
        
        document.getElementById('clickBtn').onclick = () => handleClick(uid, currentUserData);
        document.getElementById('buyPotionBtn').onclick = () => buyPotion(uid, currentUserData);
        document.getElementById('upgradePotionBtn').onclick = () => upgradePotion(uid, currentUserData);
        document.getElementById('logoutBtnGame').onclick = () => signOut(auth);
    }

    // === АВТОРИЗАЦИЯ ===
    const authPanel = document.getElementById('authPanel');
    const gamePanel = document.getElementById('gamePanel');
    const authMessage = document.getElementById('authMessage');

    function showMessage(text, isError = true) {
        authMessage.innerHTML = `<div class="${isError ? 'error' : 'success'}">${text}</div>`;
        setTimeout(() => authMessage.innerHTML = '', 3000);
    }

    document.getElementById('loginBtn').onclick = async () => {
        const email = document.getElementById('emailInput').value;
        const password = document.getElementById('passwordInput').value;
        if (!email || !password) { showMessage("Заполни оба поля"); return; }
        try {
            const userCred = await signInWithEmailAndPassword(auth, email, password);
            await createOrUpdateUserInDB(userCred.user);
            showMessage("Вход выполнен!", false);
        } catch (err) {
            showMessage("Ошибка: " + (err.message === 'Firebase: Error (auth/invalid-credential).' ? 'Неверная почта или пароль' : err.message));
        }
    };

    document.getElementById('registerBtn').onclick = async () => {
        const email = document.getElementById('emailInput').value;
        const password = document.getElementById('passwordInput').value;
        if (!email || !password) { showMessage("Заполни оба поля"); return; }
        if (password.length < 6) { showMessage("Пароль должен быть не менее 6 символов"); return; }
        try {
            const userCred = await createUserWithEmailAndPassword(auth, email, password);
            await createOrUpdateUserInDB(userCred.user);
            showMessage("Регистрация успешна!", false);
        } catch (err) {
            if (err.message.includes('email-already-in-use')) showMessage("Эта почта уже зарегистрирована");
            else showMessage("Ошибка: " + err.message);
        }
    };

    document.getElementById('resetPasswordBtn').onclick = async () => {
        const email = document.getElementById('emailInput').value;
        if (!email) { showMessage("Введи почту для сброса пароля"); return; }
        try {
            await sendPasswordResetEmail(auth, email);
            showMessage("Письмо для сброса пароля отправлено на " + email, false);
        } catch (err) {
            showMessage("Ошибка: " + (err.message.includes('user-not-found') ? 'Пользователь не найден' : err.message));
        }
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            await createOrUpdateUserInDB(user);
            const userData = await get(ref(db, `users/${user.uid}`));
            if (userData.exists() && userData.val().isBanned) {
                alert("Ваш аккаунт забанен!");
                await signOut(auth);
                return;
            }
            authPanel.style.display = 'none';
            gamePanel.style.display = 'block';
            setupGameListeners(user.uid);
            const snapshot = await get(ref(db, `users/${user.uid}`));
            if (snapshot.exists()) {
                currentUserData = snapshot.val();
                refreshGameUI(currentUserData);
                if (currentUserData.potionActive && currentUserData.potionEndTime > Date.now()) startPotionTimer(user.uid);
            }
        } else {
            if (potionTimer) clearInterval(potionTimer);
            authPanel.style.display = 'block';
            gamePanel.style.display = 'none';
            document.getElementById('emailInput').value = '';
            document.getElementById('passwordInput').value = '';
        }
    });
</script>
</body>
</html>
